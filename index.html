<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Radio Anime reproduce openings y endings aleatorios de anime con busqueda, filtros y favoritos." />
  <title>Radio Anime</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">AnimeThemes radio player</p>
        <h1 id="pageTitle">Radio Anime</h1>
        <p class="hero-copy">
          Reproduce openings y endings al azar, filtra por tipo, anime o ano, y guarda tus temas favoritos para volver rapido.
        </p>
      </div>

      <div class="stats" aria-label="Estadisticas de la coleccion">
        <article>
          <strong id="totalThemes">0</strong>
          <span>cargados</span>
        </article>
        <article>
          <strong id="visibleThemes">0</strong>
          <span>visibles</span>
        </article>
        <article>
          <strong id="favoriteCount">0</strong>
          <span>favoritos</span>
        </article>
      </div>
    </section>

    <section class="player-card" aria-label="Reproductor">
      <video id="videoPlayer" controls playsinline preload="metadata"></video>

      <div class="now-playing" id="currentPlaying" aria-live="polite">
        <p class="placeholder">Conectando con AnimeThemes...</p>
      </div>

      <div class="controls">
        <button id="playRandomButton" type="button">Siguiente aleatorio</button>
        <button id="favoriteButton" type="button" aria-pressed="false">Guardar favorito</button>
        <button id="soundButton" type="button">Activar sonido</button>
        <button id="loadMoreButton" type="button">Cargar mas</button>
      </div>
    </section>

    <section class="toolbar" aria-label="Filtros">
      <label>
        Buscar anime o tema
        <input id="searchInput" type="search" placeholder="Ej: Naruto, Evangelion, OP..." autocomplete="off" />
      </label>

      <label>
        Ano
        <input id="yearInput" type="number" min="1960" max="2100" step="1" placeholder="Ej: 2002" inputmode="numeric" />
      </label>

      <label>
        Tipo
        <select id="typeFilter">
          <option value="all">Todos</option>
          <option value="OP">Openings</option>
          <option value="ED">Endings</option>
          <option value="favorites">Favoritos</option>
        </select>
      </label>
    </section>

    <p id="loading" class="status">Cargando temas desde AnimeThemes...</p>
    <section id="themesList" class="themes-grid" aria-label="Temas encontrados"></section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
